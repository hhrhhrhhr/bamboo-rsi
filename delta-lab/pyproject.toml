[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bamboo-delta-lab"
version = "0.1.0"
description = "Windows Delta Force observation and Decision evidence probe"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["bamboo-rsi-core==0.1.0", "psutil==7.2.2"]

[project.scripts]
bamboo-delta = "bamboo_delta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../rsi-core/src"]
testpaths = ["tests"]
