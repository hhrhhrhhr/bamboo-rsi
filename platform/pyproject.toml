[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "startlux-platform"
version = "0.3.0"
description = "StartLux execution platform, scenario plugins, and Harness² optimization"
readme = "README.md"
license = "MIT AND GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE.MIT", "LICENSE.Harness2"]
requires-python = ">=3.11,<3.14"
dependencies = ["httpx[socks]==0.28.1", "pydantic==2.12.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
optimizer = ["harness2 @ git+https://github.com/google-research/harness2.git@1cfe254e8d25b15f37048c3730134686abe60335"]

[project.scripts]
startlux = "startlux.cli:main"
genshin-agent = "startlux.scenarios.genshin.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

