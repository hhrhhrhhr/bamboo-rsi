name: RSI SDK integration contracts
on:
  push:
    paths: ['rsi-sdk/**', 'rsi-core/**', '.github/workflows/rsi-sdk.yml']
  pull_request:
    paths: ['rsi-sdk/**', 'rsi-core/**', '.github/workflows/rsi-sdk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ./rsi-core -e ./rsi-sdk pytest==9.1.1
      - run: python -m pytest rsi-sdk/tests -q -c rsi-sdk/pyproject.toml
      - run: python -m pytest rsi-core/tests -q -c rsi-core/pyproject.toml
      - run: bamboo-rsi-sdk demo-orders --destination .runtime/sdk-ci-demo
      - run: python -m pip install -e ./rsi-sdk/examples/order_plugin
      - run: bamboo-rsi-sdk list
      - run: python scripts/check_public_tree.py
