name: StartLux platform and Harness2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r platform/requirements-optimizer.lock
      - run: python -m pip install --no-deps -e ./platform
      - run: python -m pytest platform/tests -q
      - name: Run official Harness2 through both scenario plugins
        run: |
          startlux optimize --scenario workspace.ledger --config platform/examples/workspace/config.json --output /tmp/workspace-run --fixture --mode sequential --k 2
          startlux optimize --scenario genshin.daily --config platform/examples/genshin/config.json --output /tmp/genshin-run --fixture --mode parallel --k 1
      - uses: actions/upload-artifact@v4
        with:
          name: StartLux-Harness2-evidence
          path: |
            /tmp/workspace-run/report.json
            /tmp/genshin-run/report.json
          retention-days: 14
