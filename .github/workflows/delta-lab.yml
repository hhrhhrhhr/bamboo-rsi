name: Delta Lab offline checks (no game or account access)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest delta-lab/tests -q -c delta-lab/pyproject.toml --junitxml=delta-test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-${{ matrix.os }}-offline-results
          path: delta-test-results.xml
