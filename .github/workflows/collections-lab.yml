name: Collection support synthetic RSI
on:
  push:
    paths: ['collections-lab/**', 'rsi-sdk/**', 'rsi-core/**', 'rsi-http/**', '.github/workflows/collections-lab.yml']
  pull_request:
    paths: ['collections-lab/**', 'rsi-sdk/**', 'rsi-core/**', 'rsi-http/**', '.github/workflows/collections-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ./rsi-core -e ./rsi-sdk -e ./rsi-http -e ./collections-lab pytest==9.1.1
      - run: python -m pytest collections-lab/tests -q -c collections-lab/pyproject.toml
      - run: bamboo-collections demo --destination .runtime/collections-ci-demo
      - run: python scripts/check_public_tree.py
