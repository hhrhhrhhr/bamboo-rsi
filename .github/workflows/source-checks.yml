name: Source checks (no game or account access)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_public_tree.py
      - run: python -m pip install -r requirements-genshin.lock
      - run: python -m pip install --no-deps -e ./platform
      - run: python -m pytest platform/tests -q
      - run: python -m pytest rsi-core/tests -q -c rsi-core/pyproject.toml
      - run: python -m pytest resin-lab/tests -q -c resin-lab/pyproject.toml
      - run: python -m pip install -r hok-lab/requirements-test.lock
      - run: python -m pytest hok-lab/tests -q -c hok-lab/pyproject.toml
      - run: node --test integrations/auto_commission/agent-main.test.cjs
