name: LoL Lab offline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r lol-lab/requirements-test.lock
      - run: python -m pytest lol-lab/tests -q -c lol-lab/pyproject.toml --junitxml=lol-test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lol-${{ matrix.os }}-offline-results
          path: lol-test-results.xml
