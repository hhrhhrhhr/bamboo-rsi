name: AI service roleplay
on:
  push:
    paths: ['service-sim/**', 'service-feedback/**', 'collections-lab/**', 'rsi-sdk/**', 'rsi-core/**', '.github/workflows/service-sim.yml']
  pull_request:
    paths: ['service-sim/**', 'service-feedback/**', 'collections-lab/**', 'rsi-sdk/**', 'rsi-core/**', '.github/workflows/service-sim.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ./rsi-core -e ./rsi-sdk -e ./rsi-http -e ./collections-lab -e ./service-feedback -e ./service-sim pytest==9.1.1
      - run: python -m pytest service-sim/tests -q -c service-sim/pyproject.toml
      - run: python scripts/check_public_tree.py
