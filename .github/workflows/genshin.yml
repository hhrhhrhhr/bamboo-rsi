name: Genshin agent foundation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genshin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-bridge:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned development dependencies
        run: |
          python -m pip install -r requirements-genshin.lock
          python -m pip install --no-deps -e ./platform
      - name: Apply pinned BetterGI integration
        run: python scripts/setup_genshin_bridge.py --checkout "$env:RUNNER_TEMP/bettergi"
      - name: Verify native host protocol
        run: dotnet test "$env:RUNNER_TEMP/bettergi/Test/BetterGenshinImpact.AgentBridge.Tests/BetterGenshinImpact.AgentBridge.Tests.csproj" --nologo -v minimal
      - name: Build fixture host
        run: dotnet build "$env:RUNNER_TEMP/bettergi/Test/BetterGenshinImpact.AgentBridge.Fixture/BetterGenshinImpact.AgentBridge.Fixture.csproj" --nologo -v minimal
      - name: Verify Python and actual Windows named pipes
        run: |
          $env:GENSHIN_DOTNET = (Get-Command dotnet).Source
          $env:GENSHIN_BRIDGE_FIXTURE_DLL = "$env:RUNNER_TEMP/bettergi/Test/BetterGenshinImpact.AgentBridge.Fixture/bin/Debug/net8.0/BetterGenshinImpact.AgentBridge.Fixture.dll"
          python -m pytest platform/tests -q
      - name: Compile BetterGI application
        run: dotnet build "$env:RUNNER_TEMP/bettergi/BetterGenshinImpact/BetterGenshinImpact.csproj" --nologo -v quiet
      - name: Verify voice intent contracts
        run: dotnet test desktop/StartLux.Desktop.Tests/StartLux.Desktop.Tests.csproj --nologo -v minimal
      - name: Build self-contained desktop payload
        run: |
          python -m pip install -r requirements-desktop.lock
          python scripts/build_genshin_desktop.py --bettergi "$env:RUNNER_TEMP/bettergi"
      - name: Package Windows installer
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DPayload=$env:GITHUB_WORKSPACE/dist/genshin-desktop" desktop/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify actual installation and desktop startup
        run: ./scripts/test_genshin_installer.ps1
      - name: Upload private preview installer and desktop evidence
        uses: actions/upload-artifact@v4
        with:
          name: StartLux-Genshin-Windows-preview
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
            dist/installer/*.png
            dist/installer/verification.json
          retention-days: 14
